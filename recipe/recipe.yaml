schema_version: 1

context:
  name: liteiclink
  version: "2026.08"
  sha256: fc0d120abca89378e784d41fd36cf17cb07b570972243f809cf2b9946cdba5f1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/enjoy-digital/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - litex ~=${{ version }}
    - pyyaml

tests:
  - python:
      imports:
        - liteiclink
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Small footprint and configurable Inter-Chip communication cores
  description: Small footprint and configurable Inter-Chip communication cores
  homepage: https://github.com/enjoy-digital/liteiclink
  repository: https://github.com/enjoy-digital/liteiclink

extra:
  recipe-maintainers:
    - enjoy-digital
    - timkpaine
